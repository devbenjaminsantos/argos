[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "argos-backend"
version = "0.1.0"
description = "Back-end modular do Argos para monitoramento de preços."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.141.1,<0.142",
    "uvicorn>=0.52.4,<0.53",
]

[tool.setuptools.packages.find]
where = ["src"]
